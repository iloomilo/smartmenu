services:
  db:
    image: postgres:18-alpine
    container_name: smartmenu-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: smartmenu
      POSTGRES_USER: smartmenu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartmenu}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartmenu -d smartmenu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
